# Amvera Cloud. Секреты (DATABASE_URL, APP_PASSWORD, JWT_SECRET, AI_API_KEY)
# задаются в интерфейсе Amvera -> Переменные -> Секреты, НЕ в этом файле.
meta:
  environment: docker
  toolchain:
    name: docker
build:
  dockerfile: Dockerfile
run:
  containerPort: 80
  env:
    NODE_ENV: production
    PORT: 80
    DATABASE_SSL: "true"
    AI_BASE_URL: https://api.deepseek.com
    AI_MODEL: deepseek-chat
